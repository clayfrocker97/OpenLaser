name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The single definition of green: `just check`, the same command as locally.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - run: rustup override set 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: just@1.58.0,cargo-deny@0.20.2
          fallback: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: just ui-install
      - run: just check

  # The workspace must still build on the declared minimum Rust version.
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
      - run: rustup toolchain install 1.97.0 --profile minimal
      - run: rustup override set 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci && npm run build
        working-directory: ui
      - run: cargo check --workspace --all-targets --all-features --locked
