[package]
name = "openlaser"
description = "The OpenLaser executable"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
embedded-ui = ["openlaser-server/embedded-ui"]
desktop = ["embedded-ui", "dep:tao", "dep:wry", "dep:muda"]

[dependencies]
openlaser-server.workspace = true
openlaser-controller.workspace = true
openlaser-core.workspace = true
openlaser-network.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tao = { workspace = true, optional = true }
wry = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { workspace = true, optional = true }

[build-dependencies]
winresource.workspace = true
