# cargo-deny: license, advisory, duplicate and source checks for every
# dependency. Run with `just deny`.

[graph]
all-features = true
# Audit the hosted desktop platforms. The transitive heapless dependency also
# declares atomic-polyfill for AVR and bare-metal targets, which this std/socket
# application cannot run on. No advisory is ignored for a supported platform.
targets = [
    "x86_64-pc-windows-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]

[advisories]
version = 2
yanked = "deny"
# Wry/Tao's Linux GTK 3 bindings still require this compile-time diagnostic
# helper. This is an unmaintained notice, with no patched version or reported
# vulnerability. It is absent from Windows/macOS dependency graphs. Revisit
# when the upstream GTK bindings migrate; other advisories remain enforced.
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "Linux-only GTK 3 build macros require proc-macro-error 1.0.4; reviewed 2026-09-12, no upstream replacement version" },
]

[licenses]
version = 2
# Allowances for licenses no current dependency uses are fine.
unused-allowed-license = "allow"
# Our own crates are GPL-3.0-or-later. Dependencies must be permissive.
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/JeroenGar/sparrow"]
